<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SaveGuard & Media</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-glow: #00ffcc;
            --bg-dark: #050b14;
            --card-bg: rgba(16, 24, 39, 0.85);
            --border-cyber: rgba(0, 255, 204, 0.3);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-cyber);
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        h1 {
            color: var(--primary-glow);
            font-family: 'Share Tech Mono', monospace;
            font-size: 22px;
            margin-bottom: 20px;
        }
        p {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .contact-box {
            background: rgba(5, 11, 20, 0.9);
            padding: 18px;
            border-radius: 10px;
            border: 1px dashed #334155;
            margin-top: 20px;
            text-align: center;
        }
        .contact-box i {
            color: var(--primary-glow);
            font-size: 24px;
            margin-bottom: 8px;
        }
        .contact-box p {
            color: #00ffcc;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 0;
            word-break: break-all;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--primary-glow);
            text-decoration: none;
            font-size: 13px;
            font-family: 'Share Tech Mono', monospace;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>&gt; CONTACT_SUPPORT.SYS</h1>
        <p>If you have any questions, security inquiries, feedback, or need assistance regarding our digital intelligence tools and media features, feel free to reach out to our team.</p>
        
        <div class="contact-box">
            <i class="fa-solid fa-envelope"></i>
            <p>support@saveguard-security.com</p>
        </div>

        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    </div>
</body>
</html>
